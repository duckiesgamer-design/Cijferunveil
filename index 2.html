<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#243b67,#10182b 45%,#060914);color:#fff}
header{text-align:center;padding:35px 20px 20px}h1{margin:0;font-size:42px;font-weight:900;letter-spacing:2px}header p{color:#aebbd5}
.container{width:min(1000px,92%);margin:auto}.panel{background:#ffffff14;border:1px solid #ffffff24;backdrop-filter:blur(18px);border-radius:24px;padding:25px;box-shadow:0 20px 60px #00000059}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:15px}label{display:block;font-size:13px;color:#aebbd5;margin-bottom:7px}
input{width:100%;padding:15px;border-radius:13px;border:1px solid #ffffff26;background:#10182b;color:white;font-size:17px;outline:none}input:focus{border-color:#58d8ff;box-shadow:0 0 0 3px #58d8ff1f}
button{align-self:end;padding:15px 24px;border:0;border-radius:13px;background:linear-gradient(135deg,#52d9ff,#4778ff);color:white;font-weight:800;font-size:16px;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px);box-shadow:0 10px 25px #468cff59}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;margin-top:30px}.card-preview{height:280px;border-radius:20px;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(145deg,#f4d87b,#a87922 45%,#56350c);box-shadow:0 15px 35px #0006;transition:.3s}.card-preview:hover{transform:translateY(-8px) scale(1.02)}
.card-preview:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,#ffffff59 45%,transparent 60%);animation:shine 3s infinite}
@keyframes shine{0%{transform:translateX(-120%)}50%,100%{transform:translateX(120%)}}
.card-inner{position:relative;z-index:2;padding:20px;height:100%}.rating{font-size:42px;font-weight:900}.subject{text-transform:uppercase;font-size:13px;font-weight:bold;margin-top:5px}.card-center{position:absolute;left:25px;right:25px;bottom:35px;text-align:center}.big-number{font-size:76px;font-weight:1000;text-shadow:3px 5px #0004}.vak{font-size:18px;font-weight:900;text-transform:uppercase}.empty{text-align:center;color:#8290aa;padding:50px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#03060ff2;z-index:100;perspective:1200px}.overlay.active{display:flex}.opening{text-align:center}.pack-text{font-size:20px;font-weight:900;letter-spacing:5px;color:#8eeaff;margin-bottom:25px;opacity:0;animation:fadeIn .7s .2s forwards}
.big-card{width:300px;height:440px;position:relative;transform-style:preserve-3d;transform:rotateY(90deg) scale(.6);opacity:0;border-radius:25px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#ffffff80,transparent 20%),linear-gradient(145deg,#ffe995,#c58b25 42%,#6d430d);box-shadow:0 0 40px #ffd75a8c,0 0 100px #ffb41e40;animation:cardOpen 1.7s .6s cubic-bezier(.17,.89,.32,1.28) forwards}
.big-card:before{content:"";position:absolute;inset:-100%;background:linear-gradient(120deg,transparent 40%,#fffc 50%,transparent 60%);animation:cardShine 1.8s 1.3s forwards}
.big-card-content{position:absolute;inset:0;padding:28px;z-index:3;text-align:left}.big-rating{font-size:70px;font-weight:1000;line-height:.9}.big-position{font-size:16px;font-weight:bold;margin-top:8px}.big-card-center{position:absolute;left:0;right:0;bottom:75px;text-align:center}.final-grade{font-size:105px;font-weight:1000;text-shadow:5px 7px #0004}.final-subject{font-size:25px;font-weight:1000;text-transform:uppercase}.opening .close{margin-top:35px;opacity:0;animation:fadeIn .5s 2.3s forwards}
@keyframes cardOpen{0%{opacity:0;transform:rotateY(90deg) rotateZ(-8deg) scale(.5)}45%{opacity:1;transform:rotateY(-15deg) rotateZ(3deg) scale(1.08)}75%{transform:rotateY(8deg) rotateZ(-2deg) scale(1)}100%{opacity:1;transform:rotateY(0) rotateZ(0) scale(1)}}
@keyframes cardShine{from{transform:translateX(-20%) translateY(-20%) rotate(10deg)}to{transform:translateX(80%) translateY(80%) rotate(10deg)}}@keyframes fadeIn{to{opacity:1}}
@media(max-width:700px){.form{grid-template-columns:1fr}button{width:100%}h1{font-size:32px}.big-card{width:260px;height:380px}}
</style>
</head>
<body>
<header><h1>⚡ GRADE CARDS</h1><p>Maak van ieder cijfer een speciale kaart</p></header>
<main class="container"><section class="panel"><div class="form">
<div><label>Cijfer</label><input id="grade" type="number" min="1" max="10" step="0.1" placeholder="Bijv. 7.5"></div>
<div><label>Vak</label><input id="subject" type="text" placeholder="Bijv. Wiskunde"></div>
<button onclick="addCard()">KAART MAKEN</button>
</div><div id="cards" class="cards"><div class="empty">Nog geen kaarten.<br>Vul hierboven een cijfer en vak in.</div></div></section></main>
<div class="overlay" id="overlay"><div class="opening"><div class="pack-text">NEW GRADE</div>
<div class="big-card"><div class="big-card-content"><div class="big-rating" id="animationRating">0</div><div class="big-position">GRADE</div><div class="big-card-center"><div class="final-grade" id="animationGrade">0</div><div class="final-subject" id="animationSubject">VAK</div></div></div></div>
<button class="close" onclick="closeCard()">SLUIT KAART</button></div></div>
<script>
let cards=[];
function addCard(){const g=document.getElementById("grade"),s=document.getElementById("subject"),grade=parseFloat(g.value),subject=s.value.trim();if(!grade||grade<1||grade>10||!subject){alert("Vul een geldig cijfer en een vak in.");return}const card={grade,subject};cards.push(card);g.value="";s.value="";renderCards();openCard(card)}
function renderCards(){const c=document.getElementById("cards");c.innerHTML="";cards.forEach(card=>{const d=document.createElement("div");d.className="card-preview";d.innerHTML=`<div class="card-inner"><div class="rating">${fmt(card.grade)}</div><div class="subject">GRADE</div><div class="card-center"><div class="big-number">${fmt(card.grade)}</div><div class="vak">${esc(card.subject)}</div></div></div>`;d.onclick=()=>openCard(card);c.appendChild(d)})}
function openCard(card){document.getElementById("animationRating").textContent=fmt(card.grade);document.getElementById("animationGrade").textContent=fmt(card.grade);document.getElementById("animationSubject").textContent=card.subject;document.getElementById("overlay").classList.add("active");const bc=document.querySelector(".big-card");bc.style.animation="none";void bc.offsetWidth;bc.style.animation="cardOpen 1.7s .6s cubic-bezier(.17,.89,.32,1.28) forwards"}
function closeCard(){document.getElementById("overlay").classList.remove("active")}
function fmt(n){return Number.isInteger(n)?n:n.toFixed(1)}
function esc(t){return t.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script>
</body>
</html>
